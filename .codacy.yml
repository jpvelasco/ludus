---
# Codacy repository configuration.
#
# Source of truth: live Codacy settings for jpvelasco/ludus, synchronized to
# .codacy/ with the Codacy CLI and checked via the Codacy API on 2026-08-04.
#
# Enabled analyzers in Codacy:
# - Revive, Trivy, Opengrep, ShellCheck, Agentlinter, and Lizard
#
# All analyzers run in Codacy. The repository does not use client-side
# build-server uploads for static analysis; CI only uploads Codacy coverage.
#
# Active Lizard patterns in Codacy Code Patterns:
# - Lizard_ccn-medium: threshold 8
# - Lizard_nloc-medium: threshold 50
# - Lizard_file-nloc-medium: threshold 500
# - Lizard_parameter-count-medium: threshold 8
# Active Revive patterns are limited to its recommended high-severity checks:
# - Revive_range
# - Revive_redefines-builtin-id
#
# Codacy does not enable/disable tools or set Lizard thresholds from this file;
# those remain Code Patterns settings. Revive's style, documentation, and
# unused-code rules stay disabled because golangci-lint owns that policy. This
# file keeps repository and tool-specific ignores versioned so cloud and local
# runs analyze the same paths.
#
# Future plan: gradually lower Lizard thresholds as repository complexity drops.

# Exclude generated/local artifacts and non-application package assets.
# Tests stay included so NLOC/complexity warnings are not hidden locally.
exclude_paths:
  - ".codacy/**"
  - "dist/**"
  - "npm/**"
  - "scripts/**"
  - "codacy_issues_*.json"
  - "coverage*.tmp"
