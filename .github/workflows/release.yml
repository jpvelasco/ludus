name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go.mod

      - name: Run GoReleaser (draft release)
        # `--draft` publishes the GitHub release as a draft, so the npm
        # package verification below can fail without leaving a
        # half-published release. The draft is finalized only after
        # `npm publish` succeeds (see the last step).
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94  # v7
        with:
          args: release --clean --draft
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Embed binary checksums into npm package
        run: node scripts/embed-checksums.js dist/checksums.txt npm/package.json

      - name: Copy LICENSE and THIRD_PARTY_NOTICES.txt into npm package
        # GoReleaser generates THIRD_PARTY_NOTICES.txt at the repo root (via the
        # `before` hook) and bundles it into the release archives. The npm
        # tarball ships from the npm/ directory, so copy both legal files in
        # before publishing — they are also listed in package.json "files".
        run: |
          cp LICENSE npm/LICENSE
          cp THIRD_PARTY_NOTICES.txt npm/THIRD_PARTY_NOTICES.txt

      - name: Verify npm tarball includes legal files
        # Acceptance check: the packed tarball must list BOTH LICENSE and
        # THIRD_PARTY_NOTICES.txt before we publish. `npm pack --dry-run`
        # prints its file listing on stderr (stdout carries only the
        # tarball name), so read the machine-readable `--json` output and
        # fail if either file is missing.
        # Runs before `npm publish` while the GitHub release is still a
        # draft, so a failure leaves nothing published.
        run: |
          npm pack --dry-run --json | jq -e '
            .[0].files | map(.path) as $paths |
            ["LICENSE", "THIRD_PARTY_NOTICES.txt"] as $required |
            ($required - $paths) as $missing |
            if ($missing | length) == 0
            then true
            else error("missing from npm tarball: " + ($missing | join(", ")))
            end
          '
        working-directory: npm

      - name: Publish npm package
        working-directory: npm
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          npm version "$VERSION" --no-git-tag-version
          npm publish --access public

      - name: Publish GitHub release
        # The release was created as a draft by the GoReleaser step above;
        # publish it only after the npm package is live, so no release is
        # ever half-published if npm fails.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "${GITHUB_REF_NAME}" --draft=false
