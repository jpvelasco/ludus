name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# Git 2.55 on windows-latest (windows-2025-vs2026) uses schannel by default.
# Some hosted runners reject github.com with SEC_E_UNTRUSTED_ROOT
# (0x80090325). OpenSSL uses Git for Windows' bundled Mozilla CA list.
# Windows jobs set GIT_CONFIG_COUNT=1; these keys are inert until then.
# GIT_CONFIG_* survives actions/checkout's temporary HOME override.
env:
  GIT_CONFIG_KEY_0: http.sslBackend
  GIT_CONFIG_VALUE_0: openssl

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a  # v9
        with:
          version: v2.12.2

  lint-windows:
    name: Lint (Windows)
    runs-on: windows-latest
    env:
      GIT_CONFIG_COUNT: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a  # v9
        with:
          version: v2.12.2

  vuln:
    name: Vulnerability scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go.mod
      - name: Run govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.1.4
          govulncheck ./...

  licenses:
    name: License gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go.mod
      - name: Run go-licenses check
        # Fails the build when a forbidden (copyleft / strong-copyleft),
        # restricted, or unknown license enters the dependency graph.
        # Disallows more than the default (forbidden, unknown) by adding
        # `restricted` so patent/strong-copyleft types are caught too.
        # `go run` with a pinned version (kept in sync with
        # scripts/third-party-notices.sh) avoids $GOPATH/bin PATH assumptions.
        run: |
          go run github.com/google/go-licenses@v1.6.0 \
            check --disallowed_types=forbidden,restricted,unknown ./...

  build:
    name: Build
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      GIT_CONFIG_COUNT: ${{ startsWith(matrix.os, 'windows') && '1' || '0' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go.mod
      - run: go build -v ./...
      - run: go vet ./...

  test:
    name: Test
    strategy:
      fail-fast: false  # one leg failing must not cancel the others' coverage uploads
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      GIT_CONFIG_COUNT: ${{ startsWith(matrix.os, 'windows') && '1' || '0' }}
    permissions:
      contents: read
      id-token: write  # OIDC; lets each leg mint the Codecov upload token
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go.mod
      # Run in bash on every OS so the working directory and tooling are
      # consistent. Go on the Windows runner writes coverage.out with CRLF line
      # endings, which Codecov's parser rejects (the upload lands in an ERROR
      # state and never merges), so strip CR in the same step. tr is identical
      # on GNU/BSD/Git-bash; the strip is a no-op on Linux/macOS.
      # -race on Linux/macOS (matching AGENTS.md invariant); Windows has no
      # race detector support in Go.
      - name: Run tests with coverage
        shell: bash
        run: |
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            go test ./... -v -coverprofile=coverage.out -covermode=atomic
          else
            go test ./... -v -race -coverprofile=coverage.out -covermode=atomic
          fi
          tr -d '\r' < coverage.out > coverage.tmp && mv coverage.tmp coverage.out
      # Upload per-OS coverage so Codecov merges all three legs. Prereq checks,
      # engine builders, and process control have Windows-only implementations,
      # so a Linux-only report covers a different file set; merging the OS
      # matrix reflects the true total.
      # use_pypi: true — install CLI from PyPI instead of cli.codecov.io so we
      # skip native-binary GPG verification (fails with "Could not verify
      # signature" when key import is empty; codecov/codecov-action#1876).
      # fail_ci_if_error: false — Codecov is a soft block; infra flakiness
      # must not fail the required test job and block valid PRs.
      - name: Upload coverage to Codecov
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5  # v7.1.1
        with:
          use_oidc: true
          use_pypi: true
          files: ./coverage.out
          fail_ci_if_error: false
      # Codacy coverage is uploaded by the trusted workflow_run workflow.
      # Keeping the report in an artifact lets Dependabot PRs provide coverage
      # without making the repository API token available to PR code.
      - name: Save coverage for Codacy
        if: ${{ !cancelled() && matrix.os == 'ubuntu-latest' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: codacy-coverage-${{ github.run_id }}-${{ github.run_attempt }}
          path: coverage.out
          if-no-files-found: error

  gosec:
    name: gosec
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go.mod
      - name: Run gosec
        # Exclusions mirror .golangci.yml's gosec linter settings, so this
        # standalone job flags the same findings as local/CI lint, not a
        # different noisier set.
        run: go run github.com/securego/gosec/v2/cmd/gosec@v2.27.1 -exclude=G104,G115,G204,G301,G304,G702,G703,G306 ./...

  trivy:
    name: Trivy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true

  goreleaser:
    name: Release build (snapshot)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go.mod
      # `release --snapshot` runs the .goreleaser.yml `before` hooks and
      # generates the unversioned archives without publishing anything, so
      # the before hook generates THIRD_PARTY_NOTICES.txt for this job.
      # (A plain `goreleaser build` needs a tag or --snapshot and never
      # generates the archives, which is why this job uses `release
      # --snapshot`.) archives.files lists the file, and a missing one
      # would fail the build. Real tag releases use the same `before` hook
      # (see .github/workflows/release.yml).
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de  # v7
        with:
          args: release --snapshot --skip=publish,sign,sbom --clean
      - name: Verify every snapshot archive ships the legal files
        # Acceptance check from #668: each archive must contain LICENSE and
        # THIRD_PARTY_NOTICES.txt. The windows build is a zip, the rest are
        # tar.gz.
        run: |
          fail=0
          # Fail if a required legal file is absent from an archive listing.
          check_listing() {
            local archive="$1" listing="$2" f
            for f in LICENSE THIRD_PARTY_NOTICES.txt; do
              if ! grep -qx "$f" <<<"$listing"; then
                echo "FAIL: $f not in $archive"
                fail=1
              fi
            done
          }
          for archive in dist/ludus_*.tar.gz; do
            check_listing "$archive" "$(tar -tzf "$archive")"
          done
          for archive in dist/ludus_*.zip; do
            check_listing "$archive" "$(python3 -m zipfile -l "$archive" | awk '{print $1}')"
          done
          exit $fail
      - name: Smoke-test the built linux binary
        # Exec the freshly built native binary to prove it runs and the version
        # ldflags resolved (not the "dev" fallback baked into internal/version.Version).
        # The runner is linux/amd64, so glob that build output. Ludus has no `version`
        # subcommand; Cobra's built-in --version flag prints the raw Version string.
        run: |
          BIN=$(find dist -type f -name ludus -path '*linux_amd64*')
          test -n "$BIN" || { echo "no linux/amd64 ludus binary in dist/"; exit 1; }
          chmod +x "$BIN"
          OUT=$("$BIN" --version)
          echo "$OUT"
          echo "$OUT" | grep -q " dev$" && { echo "version ldflags did not resolve (still 'dev')"; exit 1; }
          echo "smoke test OK"
