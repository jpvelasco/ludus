name: Codacy Coverage

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  actions: read
  contents: read

jobs:
  upload:
    # A successful Ubuntu test job can produce coverage even when another
    # independent CI leg fails. Let the artifact determine whether to upload.
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Download coverage report
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: codacy-coverage-${{ github.event.workflow_run.id }}-${{ github.event.workflow_run.run_attempt }}
          path: coverage
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}
      - name: Verify coverage report
        shell: bash
        run: test -s coverage/coverage.out
      - name: Upload coverage to Codacy
        uses: codacy/codacy-coverage-reporter-action@89d6c85cfafaec52c72b6c5e8b2878d33104c699  # v1.3.0
        env:
          # Attribute the report without checking out untrusted workflow_run
          # contents in this privileged workflow.
          CODACY_COMMIT_UUID: ${{ github.event.workflow_run.head_sha }}
        with:
          project-token: ${{ secrets.CODACY_REPOSITORY_API_TOKEN }}
          coverage-reports: coverage/coverage.out
          force-coverage-parser: go
          language: Go
