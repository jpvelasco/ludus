version: 2

# Regenerate the redistribution notice file from the live dependency graph
# (go-licenses report + save) before building. Runs on every goreleaser
# invocation that executes `before` hooks. The CI `licenses` job and the
# goreleaser snapshot job (see .github/workflows) also invoke the script
# directly, so the file is generated even on paths where hooks are skipped.
before:
  hooks:
    - bash scripts/third-party-notices.sh

builds:
  - id: ludus
    main: .
    binary: ludus
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X github.com/jpvelasco/ludus/internal/version.Version={{.Version}}
    goos:
      - linux
      - windows
      - darwin
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64

archives:
  - id: ludus
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    name_template: "ludus_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - CHANGELOG.md
      - README.md
      - THIRD_PARTY_NOTICES.txt

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"
